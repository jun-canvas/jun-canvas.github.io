<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;
  --accent:#5b8fff;--accent2:#a78bfa;--accent3:#34d399;
  --text:#e0e0e8;--muted:#6b6b80;--border:#2a2a3a;
}
html{scroll-behavior:smooth;}
body{font-family:'Courier New',monospace;background:var(--bg);color:var(--text);min-height:100vh;}

/* Nav */
.nav{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,15,0.92);backdrop-filter:blur(12px);z-index:100;}
.logo{font-size:22px;font-weight:700;letter-spacing:0.15em;color:var(--text);text-decoration:none;}
.logo span{color:var(--accent);}
.nav-links{display:flex;gap:28px;}
.nav-links a{color:var(--muted);font-size:13px;letter-spacing:0.08em;text-decoration:none;text-transform:uppercase;transition:color .2s;}
.nav-links a:hover,.nav-links a.active{color:var(--text);}

/* Article wrapper */
.article{max-width:760px;margin:0 auto;padding:64px 40px 0;}
.post-meta{display:flex;gap:16px;align-items:center;margin-bottom:18px;}
.post-num{font-size:11px;letter-spacing:0.15em;color:var(--card-accent,var(--accent));}
.post-date{font-size:11px;letter-spacing:0.1em;color:var(--muted);}
.post-tag{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:3px 10px;border:1px solid var(--border);color:var(--muted);border-radius:2px;}
.article-title{font-size:clamp(28px,5vw,42px);font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:var(--text);margin-bottom:40px;}

/* Article body (本文は読みやすい sans-serif) */
.body{font-family:system-ui,sans-serif;font-size:15.5px;line-height:1.9;color:var(--text);}
.body p{margin-bottom:22px;color:#cfcfda;}
.body h2{
  font-family:'Courier New',monospace;font-size:22px;font-weight:700;letter-spacing:-0.01em;
  color:var(--text);margin:52px 0 20px;padding-top:28px;border-top:1px solid var(--border);
}
.body h3{
  font-family:'Courier New',monospace;font-size:16px;font-weight:700;letter-spacing:0.02em;
  color:var(--card-accent,var(--accent));margin:32px 0 14px;
}
.body ul,.body ol{margin:0 0 22px 1.4em;color:#cfcfda;}
.body li{margin-bottom:10px;line-height:1.8;}
.body strong{color:var(--text);font-weight:700;}
.body a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(91,143,255,0.4);}
.body a:hover{border-bottom-color:var(--accent);}
.body code{font-family:'Courier New',monospace;font-size:13px;color:var(--accent3);background:var(--bg3);padding:2px 7px;border-radius:3px;}
.body pre{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:18px 20px;overflow-x:auto;margin:0 0 22px;}
.body pre code{background:none;padding:0;color:var(--accent3);line-height:1.7;}
.body blockquote{border-left:2px solid var(--accent2);padding:4px 0 4px 20px;margin:0 0 22px;color:var(--muted);font-style:italic;}
.figure{margin:0 0 28px;}
.figure img{width:100%;border:1px solid var(--border);border-radius:4px;display:block;}
.figure figcaption{font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:0.03em;text-align:center;}

/* Prev / Next */
.post-nav{max-width:760px;margin:56px auto 0;padding:32px 40px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:16px;}
.post-nav a{font-family:'Courier New',monospace;font-size:12px;letter-spacing:0.08em;color:var(--muted);text-decoration:none;transition:color .2s;max-width:46%;}
.post-nav a:hover{color:var(--accent);}
.post-nav .label{display:block;font-size:10px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
.post-nav .next{text-align:right;margin-left:auto;}

/* Footer */
.footer{padding:24px 40px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);letter-spacing:0.08em;border-top:1px solid var(--border);margin-top:40px;}
.footer-logo{color:var(--text);font-weight:700;text-decoration:none;}
@media(max-width:640px){.nav{padding:16px 20px;}.article,.post-nav{padding-left:20px;padding-right:20px;}}
